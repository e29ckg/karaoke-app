<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Karaoke</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Sarabun', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background-color: #1e1e1e; border: 1px solid #333; box-shadow: 0 4px 20px rgba(0,0,0,0.5); padding: 2rem; border-radius: 12px; width: 100%; max-width: 400px; }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <h2 class="mb-4 text-primary">🎤 Admin Login</h2>
        <form action="/login" method="POST">
            <div class="mb-3">
                <input type="password" name="password" class="form-control bg-dark text-white border-secondary" placeholder="กรอกรหัสผ่าน..." required autofocus>
            </div>
            <button type="submit" class="btn btn-primary w-100">เข้าสู่ระบบ</button>
        </form>
        <script>
            // แจ้งเตือนถ้ารหัสผิด
            if(window.location.search.includes('error=1')) {
                document.write('<div class="mt-3 text-danger small">รหัสผ่านไม่ถูกต้อง!</div>');
            }
        </script>
    </div>
</body>
</html>
