<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark"> 
    <title>Karaoke Player</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎤</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; margin: 0; overflow: hidden; font-family: 'Sarabun', sans-serif; }
        #player { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            pointer-events: none; display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        #qr-container {
            position: absolute; bottom: 40px; right: 40px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 20px; border-radius: 16px;
            text-align: center; color: #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            transition: opacity 0.5s ease;
        }
        #qr-code img { display: block; border: 4px solid white; border-radius: 4px; }
        .room-label { font-size: 14px; font-weight: bold; color: #d32f2f; margin-bottom: 5px; text-transform: uppercase; }

        #status-bar { 
            position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.85); padding: 15px 30px; border-radius: 50px;
            text-align: center; color: white; display: none; border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }
        .status-title { font-size: 24px; font-weight: bold; white-space: nowrap; max-width: 80vw; overflow: hidden; text-overflow: ellipsis; }
        .status-singer { font-size: 18px; color: #ffca28; margin-top: 5px; }

        #idle-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 5; color: white; text-align: center;
        }

        /* ปุ่มเริ่มระบบ (สำคัญมาก) */
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer;
        }
        .play-btn { font-size: 80px; color: white; transition: transform 0.2s; }
        .play-btn:hover { transform: scale(1.1); color: #4CAF50; }
        
        /* Container สำหรับ Effect */
        #effect-container {
            position: fixed;
            bottom: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; /* เพื่อให้กดทะลุได้ ไม่บังวิดีโอ */
            z-index: 9999;
            overflow: hidden;
        }

        /* ตัว Emoji ที่จะลอย */
        .floating-emoji {
            position: absolute;
            bottom: -50px; /* เริ่มต้นจากใต้จอ */
            font-size: 4rem; /* ขนาด Emoji */
            animation: floatUp 4s ease-in forwards;
            opacity: 0.8;
        }

        /* อนิเมชั่นลอยขึ้น */
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(-110vh) scale(1.2); opacity: 0; }
        }

        /* ป้ายชื่อคนส่ง (Fix สำหรับ WebOS/Tizen) */
        .effect-notification {
            position: fixed;
            top: 15%; 
            left: 50%;
            transform: translateX(-50%);
            
            /* พื้นหลังทึบเกือบ 100% เพื่อป้องกันทีวีปรับสี */
            background-color: rgba(0, 0, 0, 0.95) !important;
            
            /* บังคับสีขาว */
            color: #ffffff !important;
            
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 2rem;
            font-weight: bold;
            
            /* ขอบและเงาชัดๆ */
            border: 3px solid #ffc107 !important;
            box-shadow: 0 0 25px rgba(255, 193, 7, 0.8) !important;
            
            /* เงาตัวอักษรสีดำ (สำคัญมากสำหรับทีวี) */
            text-shadow: 2px 2px 4px #000000 !important;

            z-index: 10000;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
            white-space: nowrap;

            /* ป้องกันการกระพริบ */
            backface-visibility: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* [NEW] Class เฉพาะสำหรับชื่อคนส่ง (สีเหลืองทอง) */
        .sender-name {
            color: #ffc107 !important; 
            font-weight: 900 !important;
            text-shadow: 2px 2px 0px #000000 !important; /* ขอบดำหนา */
        }
        
        .effect-notification.show {
            opacity: 1;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: translateX(-50%) scale(0.5); }
            to { transform: translateX(-50%) scale(1); }
        }
    </style>
</head>
<body>
    <div id="effect-container"></div>
    <div id="effect-notify" class="effect-notification"></div>
    
    <div id="start-overlay" onclick="startSystem()">
        <div class="play-btn">▶</div>
        <h2 style="color:white; margin-top:20px;">คลิกเพื่อเริ่มระบบคาราโอเกะ</h2>
        <p style="color:#aaa;">(จำเป็นต้องคลิกเพื่อให้เสียงออก)</p>
    </div>

    <div id="idle-screen">
        <h1>🎵 Karaoke Ready</h1>
        <p style="font-size: 1.5em;">สแกน QR Code เพื่อเลือกเพลง</p>
    </div>

    <div id="player"></div>

    <div id="overlay">
        <div id="status-bar">
            <div class="status-title" id="song-title">Song Title</div>
            <div class="status-singer" id="song-singer">🎤 Requester</div>
        </div>
        
        <div id="qr-container">
            <div class="room-label" id="roomLabel">ROOM: DEFAULT</div>
            <div id="qr-code"></div>
            <div style="font-size:12px; margin-top:5px;">สแกนเลย!</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let currentRoom = urlParams.get('room');

        if (!currentRoom) {
            const randomNum = Math.floor(Math.random() * 9000) + 1000;
            currentRoom = 'Room' + randomNum;
            const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?room=' + currentRoom;
            window.history.replaceState({path:newUrl}, '', newUrl);
        }
        document.getElementById('roomLabel').innerText = `ROOM: ${currentRoom}`;

        const socket = io({ transports: ['websocket'] });
        let player;

        function startSystem() {
            document.getElementById('start-overlay').style.opacity = '0';
            setTimeout(() => { document.getElementById('start-overlay').style.display = 'none'; }, 500);
            
            if (player && player.playVideo) {
                player.playVideo(); 
                setTimeout(() => { player.pauseVideo(); }, 100);
            }
        }

        socket.on('connect', () => {
            socket.emit('joinRoom', currentRoom);
        });

        socket.on('serverDomain', (url) => {
            document.getElementById('qr-code').innerHTML = "";
            new QRCode(document.getElementById("qr-code"), {
                text: url, width: 140, height: 140, colorDark : "#000000", colorLight : "#ffffff"
            });
        });

        socket.on('playSong', (song) => {
            document.getElementById('idle-screen').style.display = 'none';
            const statusBar = document.getElementById('status-bar');
            document.getElementById('song-title').innerText = song.title;
            document.getElementById('song-singer').innerText = `🎤 ร้องโดย: ${song.requester}`;
            
            statusBar.style.display = 'block';
            document.getElementById('qr-container').style.opacity = '0.3';
            setTimeout(() => { statusBar.style.display = 'none'; }, 8000);

            if(player && player.loadVideoById) {
                player.loadVideoById(song.id);
            }
        });

        socket.on('stopPlayer', () => {
             if (player && player.stopVideo) player.stopVideo();
             document.getElementById('idle-screen').style.display = 'flex';
             document.getElementById('qr-container').style.opacity = '1';
        });

        socket.on('replaySong', () => {
            if (player && player.seekTo) {
                player.seekTo(0, true);
                player.playVideo();
                const statusBar = document.getElementById('status-bar');
                statusBar.style.display = 'block';
                document.getElementById('song-singer').innerText = "↺ เอาใหม่อีกรอบ!";
                setTimeout(() => { statusBar.style.display = 'none'; }, 3000);
            }
        });

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%', width: '100%', videoId: '',
                playerVars: { 'autoplay': 1, 'controls': 0, 'disablekb': 1, 'iv_load_policy': 3, 'rel': 0 },
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                socket.emit('songEnded');
            }
        }

        // รับคำสั่งแสดง Effect
        let notifyTimeout;

        socket.on('showEffect', (data) => {
            // data.type = 'heart', data.sender = 'พี่โจ้'
            
            const container = document.getElementById('effect-container');
            const notifyBox = document.getElementById('effect-notify');
            
            const emojis = {
                'heart': '❤️',
                'flower': '🌹',
                'beer': '🍻',
                'fire': '🔥'
            };
            const symbol = emojis[data.type] || '✨';

            // --- 1. แสดงป้ายชื่อ (ปรับปรุงสำหรับ TV) ---
            // ใช้ Class .sender-name เพื่อล็อกสีเหลืองทอง
            // และใช้ Inline Style + text-shadow สำหรับข้อความด้านหลังให้ขาวชัด
            notifyBox.innerHTML = `<span class="sender-name">${data.sender}</span> <span style="color:white; text-shadow: 2px 2px 0 #000;">ส่ง ${symbol} ให้กำลังใจ!</span>`;
            
            notifyBox.classList.add('show');

            // ตั้งเวลาให้ป้ายหายไปใน 3 วินาที
            clearTimeout(notifyTimeout); 
            notifyTimeout = setTimeout(() => {
                notifyBox.classList.remove('show');
            }, 3000);

            // --- 2. ปล่อย Emoji ลอยฟุ้ง ---
            const count = Math.floor(Math.random() * 5) + 5;
            for (let i = 0; i < count; i++) {
                createFloatingEmoji(container, symbol);
            }
        });

        function createFloatingEmoji(container, symbol) {
            const el = document.createElement('div');
            el.classList.add('floating-emoji');
            el.innerText = symbol;
            
            el.style.left = Math.random() * 80 + 10 + '%';
            el.style.animationDuration = (Math.random() * 2 + 3) + 's';
            el.style.fontSize = (Math.random() * 2 + 2) + 'rem';
            el.style.animationDelay = Math.random() * 0.5 + 's';

            container.appendChild(el);

            setTimeout(() => {
                el.remove();
            }, 5000);
        }
    </script>
</body>
</html>
