<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Karaoke Player Screen</title>
    <style>
        body { background-color: #000; color: white; margin: 0; overflow: hidden; font-family: sans-serif; }
        #player { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* Layer ข้อมูลที่จะลอยอยู่เหนือวิดีโอ */
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            pointer-events: none; /* ให้คลิกทะลุไปโดน YouTube ได้ */
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        /* กล่อง QR Code มุมขวาล่าง */
        #qr-container {
            position: absolute; bottom: 20px; right: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px; border-radius: 10px;
            text-align: center; color: black;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #qr-code img { display: block; margin: 0 auto; }
        .scan-text { font-size: 14px; font-weight: bold; margin-bottom: 5px; }

        /* ข้อความสถานะ */
        #status { font-size: 3em; text-shadow: 2px 2px 4px #000; margin-bottom: 20px; text-align: center;}
    </style>
</head>
<body>

    <div id="player"></div>

    <div id="overlay">
        <h1 id="status">รอเพลง...</h1>
        
        <div id="qr-container">
            <div class="scan-text">สแกนเพื่อสั่งเพลง 📱</div>
            <div id="qr-code"></div>
            <div id="ip-text" style="font-size:10px; margin-top:2px; color:#555;">Loading...</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const socket = io();
        let player;

        // รับ IP จาก Server มาสร้าง QR Code
        socket.on('serverDomain', (ip) => {
            const url = `${ip}/admin.html`;
            document.getElementById('ip-text').innerText = url;
            
            // ล้าง QR เก่า (ถ้ามี) แล้วสร้างใหม่
            document.getElementById('qr-code').innerHTML = "";
            new QRCode(document.getElementById("qr-code"), {
                text: url,
                width: 128,
                height: 128
            });
        });

        // ... (ส่วน YT.Player และ Logic การเล่นเพลง เหมือนเดิมทุกอย่าง) ...
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%', width: '100%', videoId: '',
                playerVars: { 'autoplay': 1, 'controls': 0 },
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                socket.emit('songEnded');
            }
        }

       socket.on('playSong', (song) => {
            // จัดการข้อความที่จะโชว์
            const statusText = document.getElementById('status');
            
            // ใช้ HTML แสดงผลให้สวยงาม
            statusText.innerHTML = `
                <div style="font-size: 0.5em; opacity: 0.8;">กำลังเล่นเพลง</div>
                ${song.title}<br>
                <div style="font-size: 0.6em; color: #ffeb3b; margin-top: 10px;">
                    🎤 ร้องโดย: ${song.requester}
                </div>
            `;
            
            statusText.style.display = 'block';
            
            // ซ่อนข้อความหลังผ่านไป 8 วินาที (โชว์นานหน่อยจะได้เห็นทั่วกัน)
            setTimeout(() => {
                statusText.style.display = 'none';
            }, 8000);

            if(player && player.loadVideoById) {
                player.loadVideoById(song.id);
            }
        });

        socket.on('stopPlayer', () => {
             if (player && player.stopVideo) player.stopVideo();
             document.getElementById('status').style.display = 'block';
             document.getElementById('status').innerText = "คิวว่างแล้วจ้า";
        });
    </script>
</body>
</html>
