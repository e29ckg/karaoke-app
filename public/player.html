<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark"> 
    <title>Karaoke Player</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎤</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; margin: 0; overflow: hidden; font-family: 'Sarabun', sans-serif; }
        #player { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            pointer-events: none; display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        #qr-container {
            position: absolute; bottom: 40px; right: 40px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 20px; border-radius: 16px;
            text-align: center; color: #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            transition: opacity 0.5s ease;
        }
        #qr-code img { display: block; border: 4px solid white; border-radius: 4px; }
        .room-label { font-size: 14px; font-weight: bold; color: #d32f2f; margin-bottom: 5px; text-transform: uppercase; }

        #status-bar { 
            position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.85); padding: 15px 30px; border-radius: 50px;
            text-align: center; color: white; display: none; border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }
        .status-title { font-size: 24px; font-weight: bold; white-space: nowrap; max-width: 80vw; overflow: hidden; text-overflow: ellipsis; }
        .status-singer { font-size: 18px; color: #ffca28; margin-top: 5px; }

        #idle-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?q=80&w=1920'); 
            background-size: cover; 
            background-position: center; 
            background-color: rgba(0, 0, 0, 0.6);
            background-blend-mode: overlay;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 5; color: white; text-align: center;
            /* เพิ่มลูกเล่นเวลาเปลี่ยนภาพ */
            transition: background-image 1s ease-in-out;
        }
        
        #effect-container {
            position: fixed;
            bottom: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; 
            z-index: 9999;
            overflow: hidden;
        }

        .floating-emoji {
            position: absolute;
            bottom: -50px; 
            font-size: 4rem; 
            animation: floatUp 4s ease-in forwards;
            opacity: 0.8;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(-110vh) scale(1.2); opacity: 0; }
        }

        .effect-notification {
            position: fixed;
            top: 15%; 
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.95) !important;
            color: #ffffff !important;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 2rem;
            font-weight: bold;
            border: 3px solid #ffc107 !important;
            box-shadow: 0 0 25px rgba(255, 193, 7, 0.8) !important;
            text-shadow: 2px 2px 4px #000000 !important;
            z-index: 10000;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
            white-space: nowrap;
            backface-visibility: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .sender-name {
            color: #ffc107 !important; 
            font-weight: 900 !important;
            text-shadow: 2px 2px 0px #000000 !important; 
        }
        
        .effect-notification.show {
            opacity: 1;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: translateX(-50%) scale(0.5); }
            to { transform: translateX(-50%) scale(1); }
        }

        /* หน้าจอเริ่มต้น */
        #start-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, #1a0533 0%, #000000 70%);
            z-index: 9998;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.8s ease;
        }
        #start-overlay .pulse-ring {
            width: 160px; height: 160px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7b2ff7, #f107a3);
            display: flex; align-items: center; justify-content: center;
            font-size: 4rem;
            box-shadow: 0 0 0 0 rgba(123, 47, 247, 0.7);
            animation: pulse 2s infinite;
            transition: transform 0.2s ease;
        }
        #start-overlay:hover .pulse-ring {
            transform: scale(1.08);
        }
        @keyframes pulse {
            0%   { box-shadow: 0 0 0 0 rgba(123, 47, 247, 0.7); }
            70%  { box-shadow: 0 0 0 30px rgba(123, 47, 247, 0); }
            100% { box-shadow: 0 0 0 0 rgba(123, 47, 247, 0); }
        }
        #start-overlay h1 {
            margin-top: 30px;
            font-size: 2.5rem;
            background: linear-gradient(90deg, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }
        #start-overlay p {
            color: rgba(255,255,255,0.5);
            font-size: 1.1rem;
            margin-top: 10px;
        }
        #start-overlay .stars {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden;
            pointer-events: none;
        }
        #start-overlay .star {
            position: absolute;
            width: 3px; height: 3px;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--d, 3s) infinite var(--delay, 0s);
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
        }
    </style>
</head>
<body>
    <div id="effect-container"></div>
    <div id="effect-notify" class="effect-notification"></div>

    <!-- หน้าจอเริ่มต้น: คลิกเพื่อเริ่มระบบ + ปลดล็อกเสียง -->
    <div id="start-overlay" onclick="startSystem()">
        <div class="stars" id="star-field"></div>
        <div class="pulse-ring">🎤</div>
        <h1>Karaoke System</h1>
        <p>แตะหน้าจอเพื่อเริ่มระบบ</p>
    </div>

    <div id="idle-screen">
        <h1>🎵 Karaoke Ready</h1>
        <p style="font-size: 1.5em;">สแกน QR Code เพื่อเลือกเพลง</p>
    </div>

    <div id="player"></div>

    <div id="overlay">
        <div id="status-bar">
            <div class="status-title" id="song-title">Song Title</div>
            <div class="status-singer" id="song-singer">🎤 Requester</div>
        </div>
        
        <div id="qr-container">
            <div class="room-label" id="roomLabel">ROOM: DEFAULT</div>
            <div id="qr-code"></div>
            <div style="font-size:12px; margin-top:5px;">สแกนเลย!</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let currentRoom = urlParams.get('room');

        if (!currentRoom) {
            const randomNum = Math.floor(Math.random() * 9000) + 1000;
            currentRoom = 'Room' + randomNum;
            const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?room=' + currentRoom;
            window.history.replaceState({path:newUrl}, '', newUrl);
        }
        document.getElementById('roomLabel').innerText = `ROOM: ${currentRoom}`;

        const socket = io({ transports: ['websocket'] });
        let player;

        // เชื่อมต่อ Socket
        socket.on('connect', () => {
            socket.emit('joinRoom', currentRoom);
        });

        socket.on('serverDomain', (url) => {
            document.getElementById('qr-code').innerHTML = "";
            new QRCode(document.getElementById("qr-code"), {
                text: url, width: 140, height: 140, colorDark : "#000000", colorLight : "#ffffff"
            });
        });

        function playSongNow(song) {
            document.getElementById('idle-screen').style.display = 'none';
            const statusBar = document.getElementById('status-bar');
            document.getElementById('song-title').innerText = song.title;
            document.getElementById('song-singer').innerText = `🎤 ร้องโดย: ${song.requester}`;

            statusBar.style.display = 'block';
            document.getElementById('qr-container').style.opacity = '0.3';
            setTimeout(() => { statusBar.style.display = 'none'; }, 8000);

            if (player && player.loadVideoById) {
                player.loadVideoById(song.id);
            }
        }

        socket.on('playSong', (song) => {
            // ถ้า start-overlay ยังแสดงอยู่ (ยังไม่คลิก) ให้รอไว้ก่อน
            const overlay = document.getElementById('start-overlay');
            if (overlay && overlay.style.display !== 'none' && overlay.style.opacity !== '0') {
                pendingSong = song; // เก็บไว้รอ
                return;
            }
            playSongNow(song);
        });

        socket.on('stopPlayer', () => {
             if (player && player.stopVideo) player.stopVideo();
             document.getElementById('idle-screen').style.display = 'flex';
             document.getElementById('qr-container').style.opacity = '1';
        });

        socket.on('replaySong', () => {
            if (player && player.seekTo) {
                player.seekTo(0, true);
                player.playVideo();
                const statusBar = document.getElementById('status-bar');
                statusBar.style.display = 'block';
                document.getElementById('song-singer').innerText = "↺ เอาใหม่อีกรอบ!";
                setTimeout(() => { statusBar.style.display = 'none'; }, 3000);
            }
        });

        // === ระบบหน้าจอเริ่มต้น ===
        let playerReady = false;
        let pendingSong = null;

        // สร้างดาวในพื้นหลัง
        const starField = document.getElementById('star-field');
        for (let i = 0; i < 80; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.cssText = `
                left: ${Math.random() * 100}%;
                top:  ${Math.random() * 100}%;
                --d: ${(Math.random() * 3 + 2).toFixed(1)}s;
                --delay: ${(Math.random() * 3).toFixed(1)}s;
                width:  ${Math.random() < 0.2 ? 4 : 2}px;
                height: ${Math.random() < 0.2 ? 4 : 2}px;
            `;
            starField.appendChild(star);
        }

        function startSystem() {
            const overlay = document.getElementById('start-overlay');
            overlay.style.opacity = '0';
            overlay.style.pointerEvents = 'none';
            setTimeout(() => { overlay.style.display = 'none'; }, 800);

            // เข้า Fullscreen
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }

            // ปลดล็อกเสียงด้วยการสั่ง play แล้วหยุดทันที
            if (player && player.playVideo) {
                player.playVideo();
                setTimeout(() => { player.pauseVideo(); }, 50);
            }

            // ถ้ามีเพลงรอเล่นอยู่ (ถูกสั่งมาก่อนที่จะ start)
            if (pendingSong) {
                setTimeout(() => playSongNow(pendingSong), 200);
                pendingSong = null;
            }
        }

        // กำหนดค่า YouTube API
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%', width: '100%', videoId: '',
                playerVars: { 'autoplay': 1, 'controls': 0, 'disablekb': 1, 'iv_load_policy': 3, 'rel': 0 },
                events: {
                    'onReady': () => { playerReady = true; },
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                socket.emit('songEnded');
            }
        }

        // รับคำสั่งแสดง Effect
        let notifyTimeout;
        socket.on('showEffect', (data) => {
            const container = document.getElementById('effect-container');
            const notifyBox = document.getElementById('effect-notify');
            
            const emojis = { 'heart': '❤️', 'flower': '🌹', 'beer': '🍻', 'fire': '🔥' };
            const symbol = emojis[data.type] || '✨';

            notifyBox.innerHTML = `<span class="sender-name">${data.sender}</span> <span style="color:white; text-shadow: 2px 2px 0 #000;">ส่ง ${symbol} ให้กำลังใจ!</span>`;
            notifyBox.classList.add('show');

            clearTimeout(notifyTimeout); 
            notifyTimeout = setTimeout(() => {
                notifyBox.classList.remove('show');
            }, 3000);

            const count = Math.floor(Math.random() * 5) + 5;
            for (let i = 0; i < count; i++) {
                createFloatingEmoji(container, symbol);
            }
        });

        function createFloatingEmoji(container, symbol) {
            const el = document.createElement('div');
            el.classList.add('floating-emoji');
            el.innerText = symbol;
            
            el.style.left = Math.random() * 80 + 10 + '%';
            el.style.animationDuration = (Math.random() * 2 + 3) + 's';
            el.style.fontSize = (Math.random() * 2 + 2) + 'rem';
            el.style.animationDelay = Math.random() * 0.5 + 's';

            container.appendChild(el);

            setTimeout(() => { el.remove(); }, 5000);
        }

        // ระบบภาพพักหน้าจอ (Screensaver Slideshow)
        let bgImages = [];
        let bgIndex = 0;
        let slideShowInterval;

        socket.on('updateScreensaver', (images) => {
            bgImages = images;
            clearInterval(slideShowInterval);
            
            if(bgImages.length > 0) {
                changeBackground(); 
                slideShowInterval = setInterval(changeBackground, 10000);
            } else {
                document.getElementById('idle-screen').style.backgroundImage = 'none';
                document.body.style.backgroundImage = 'none';
            }
        });

        function changeBackground() {
            if (bgImages.length === 0) return;
            const currentUrl = `url('${bgImages[bgIndex]}')`;
            const idleScreen = document.getElementById('idle-screen');
            
            idleScreen.style.backgroundImage = currentUrl;
            document.body.style.backgroundImage = currentUrl; 
            
            bgIndex = (bgIndex + 1) % bgImages.length;
        }
    </script>
</body>
</html>
